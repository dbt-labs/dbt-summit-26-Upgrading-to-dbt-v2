site_name: Upgrading to dbt Core v2
site_description: Training materials for upgrading a dbt Core project to dbt Core v2
site_url: https://dbt-labs.github.io/dbt-summit-26-Upgrading-to-dbt-v2/

theme:
  name: material
  palette: 
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - content.action.edit
    - toc.integrate

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 3
      permalink: "#"
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - admonition

repo_url: https://github.com/dbt-labs/dbt-summit-26-Upgrading-to-dbt-v2
repo_name: dbt-labs/dbt-summit-26-Upgrading-to-dbt-v2
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Lab:
      - 0 - Setup and context: lab/00-setup.md
      - 1 - Parse and deprecations: lab/01-parse-and-deprecations.md
      - 2 - Compile with analysis off: lab/02-compile-static-analysis-off.md
      - 3 - Baseline and strict: lab/03-baseline-and-strict.md
      - 4 - Run, build, and state: lab/04-run-build-and-state.md
      - 5 - Deferral and rollout: lab/05-deferral-and-rollout.md
  - Instructor notes: instructor-notes.md