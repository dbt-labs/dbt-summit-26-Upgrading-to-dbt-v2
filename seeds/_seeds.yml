version: 2

seeds:
  - name: raw_customers
    description: "Raw customer records landed from the grimoire_crm CRM extract."
    config:
      column_types:
        customer_id: varchar(20)
        signed_up_at: varchar(30)
        birth_year: integer

  - name: raw_guilds
    description: "Raw guild reference data from grimoire_crm."

  - name: raw_guild_memberships
    description: "Raw customer-to-guild membership intervals (SCD2 shaped at source)."
    config:
      column_types:
        valid_from: varchar(30)
        valid_to: varchar(30)

  - name: raw_potions
    description: "Raw potion catalogue from the abra_pos point-of-sale system."
    config:
      column_types:
        is_regulated: varchar(10)
        introduced_at: varchar(30)

  - name: raw_orders
    description: "Raw order headers from abra_pos. One row per order."
    config:
      column_types:
        ordered_at: varchar(30)

  - name: raw_order_items
    description: "Raw order lines from abra_pos. One row per potion per order."

  - name: raw_payments
    description: "Raw payment attempts from abra_pos. Splits, failures and refunds each get a row."
    config:
      column_types:
        paid_at: varchar(30)

  - name: raw_shops
    description: "Raw shop dimension from alembic_ops. Region spelling here is canonical."
    config:
      column_types:
        opened_at: varchar(30)

  - name: raw_suppliers
    description: "Raw supplier dimension from alembic_ops."
    config:
      column_types:
        contracted_since: varchar(30)

  - name: raw_ingredients
    description: "Raw ingredient dimension from alembic_ops."
    config:
      column_types:
        is_hazardous: varchar(10)

  - name: raw_potion_ingredients
    description: "Raw recipe bridge. Natural key is (potion_sku, ingredient_id)."

  - name: raw_brew_events
    description: "Raw production batches from alembic_ops. One row per brew."
    config:
      column_types:
        brewed_at: varchar(30)
