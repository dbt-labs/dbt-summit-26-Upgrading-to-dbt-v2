name: 'merlinco_apothecaries'
version: '1.0.0'
config-version: 2

profile: 'sa_snowflake'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Controls how the order fact tables materialize. "standard" is what the
  # nightly deploy job uses; "backfill" is set by hand for reprocessing runs.
  PIPELINE_RUN_MODE: standard
  copper_per_gold_crown: 100

models:
  merlinco_apothecaries:
    +materialized: view
    staging:
      grimoire_crm:
        +schema: staging
      abra_pos:
        +schema: staging
      alembic_ops:
        +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      materialized: table
      +tags: ['core_lab']
      compliance:
        +materialized: audit_table
        +static_analysis: 'off'

seeds:
  merlinco_apothecaries:
    +schema: raw
    grimoire_crm:
      +tags: ['crm']
    abra_pos:
      +tags: ['pos']
    alembic_ops:
      +tags: ['ops']

snapshots:
  merlinco_apothecaries:
    +target_schema: snapshots
