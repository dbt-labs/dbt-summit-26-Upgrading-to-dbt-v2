name: 'merlinco_apothecaries'
version: '1.0.0'
config-version: 2

profile: 'sa_snowflake'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  merlinco_apothecaries:
    +materialized: view
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +tags: ['core_lab']

seeds:
  merlinco_apothecaries:
    +enabled: false
    +database: raw
    +schema: merlinco_apothecaries
    grimoire_crm:
      +tags: ['crm']
    abra_pos:
      +tags: ['pos']
    alembic_ops:
      +tags: ['ops']
