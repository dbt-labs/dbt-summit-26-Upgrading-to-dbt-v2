name: 'merlinco_apothecaries'
version: '1.0.0'
config-version: 2

profile: 'sa_snowflake'

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Controls how the order fact tables materialize. "standard" is what the
  # nightly deploy job uses; "backfill" is set by hand for reprocessing runs.
  PIPELINE_RUN_MODE: standard
  copper_per_gold_crown: 100
  # Quarantined models are back in the graph as of 2026-09-02, now that Core v2
  # static analysis identified why each one was broken.
  include_quarantined: true
  # Categories the marts layer pivots on. Declared rather than discovered, so
  # the project compiles without a warehouse connection. Kept honest by the
  # accepted_values test on stg_abra_pos__potions.category.
  potion_categories:
    - clarity
    - healing
    - invisibility
    - love
    - luck
    - strength

models:
  merlinco_apothecaries:
    +materialized: view
    staging:
      grimoire_crm:
        +schema: staging
      abra_pos:
        +schema: staging
      alembic_ops:
        +schema: staging
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +tags: ['core_lab']
      compliance:
        +materialized: audit_table
        # Tidied up during the upgrade -- the quotes looked redundant.
        +static_analysis: off
      quarantine:
        # Formerly switched off during past incidents. Static analysis found the
        # defect in each one, so they are back in the nightly job.
        +enabled: "{{ var('include_quarantined', true) }}"
        +tags: ['quarantined']

seeds:
  merlinco_apothecaries:
    +schema: raw
    grimoire_crm:
      +tags: ['crm']
    abra_pos:
      +tags: ['pos']
    alembic_ops:
      +tags: ['ops']

snapshots:
  merlinco_apothecaries:
    +target_schema: snapshots

flags:
  # Set by dbt-autofix: parse values under a test's `arguments` property as the
  # test's keyword arguments.
  require_generic_test_arguments_property: true
