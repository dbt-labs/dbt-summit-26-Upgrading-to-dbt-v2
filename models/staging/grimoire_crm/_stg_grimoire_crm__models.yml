version: 2

models:
  - name: stg_grimoire_crm__customers
    description: "One row per customer, with region codes conformed and casing normalized."
    columns:
      - name: customer_id
        description: "Primary key. CRM-issued wizard identifier, e.g. WIZ-00001."
        tests:
          - unique
          - not_null
      - name: email
        description: "Contact email. Roughly 2% of customers have none on file."
      - name: home_region
        description: "Self-reported region, conformed to the canonical shop region spelling."
        tests:
          - accepted_values:
              values:
                - 'Northern Reaches'
                - 'Crystal Vale'
                - 'The Marshlands'
                - 'Ember Coast'
                - 'Silverwood'
      - name: favored_discipline
        description: "Magical discipline the customer favors, lowercased."

  - name: stg_grimoire_crm__guilds
    description: "One row per guild."
    columns:
      - name: guild_id
        description: "Primary key."
        tests:
          - unique
          - not_null

  - name: stg_grimoire_crm__guild_memberships
    description: "One row per customer-guild-tier interval. valid_to is null for the current row."
    columns:
      - name: membership_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_grimoire_crm__customers."
        tests:
          - not_null
          - relationships:
              to: ref('stg_grimoire_crm__customers')
              field: customer_id
      - name: guild_id
        description: "Foreign key to stg_grimoire_crm__guilds."
        tests:
          - not_null
      - name: tier
        description: "Membership tier, lowercased."
        tests:
          - accepted_values:
              values: ['apprentice', 'adept', 'archmage']
      - name: is_current_membership
        description: "True when the source row has no valid_to, i.e. it is the live tier."
