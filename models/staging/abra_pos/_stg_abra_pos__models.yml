version: 2

models:
  - name: stg_abra_pos__orders
    description: "One row per order header from the point-of-sale system."
    columns:
      - name: order_id
        description: "Primary key, e.g. ORD-000001."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to stg_grimoire_crm__customers."
        tests:
          - not_null
      - name: shop_id
        description: "Foreign key to stg_alembic_ops__shops."
        tests:
          - not_null
      - name: ordered_at
        description: "Order timestamp, parsed from either source format."
        tests:
          - not_null
      - name: order_status
        description: "Lowercased order status."
        tests:
          - accepted_values:
              arguments:
                values: ['completed', 'returned', 'cancelled', 'placed']
      - name: channel
        description: "Sales channel the order came through."
        tests:
          - accepted_values:
              arguments:
                values: ['in_store', 'courier_owl', 'marketplace']

  - name: stg_abra_pos__order_items
    description: "One row per potion per order. A SKU never repeats within an order."
    columns:
      - name: order_item_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to stg_abra_pos__orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_abra_pos__orders')
                field: order_id
      - name: potion_sku
        description: "Foreign key to stg_abra_pos__potions."
        tests:
          - not_null
      - name: quantity
        description: "Units sold on this line, 1-5 and skewed to 1."
        tests:
          - not_null

  - name: stg_abra_pos__payments
    description: "One row per payment attempt. Splits, failures and refunds each get a row."
    columns:
      - name: payment_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to stg_abra_pos__orders."
        tests:
          - not_null
      - name: payment_method
        description: "How the customer paid."
        tests:
          - accepted_values:
              arguments:
                values: ['coin', 'guild_credit', 'crystal_transfer', 'barter']
      - name: payment_status
        description: "Outcome of the payment attempt."
        tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'refunded']

  - name: stg_abra_pos__potions
    description: "One row per potion in the catalogue."
    columns:
      - name: potion_sku
        description: "Primary key, e.g. POT-0001."
        tests:
          - unique
          - not_null
      - name: category
        description: "Merchandising category, lowercased."
      - name: base_price_copper
        description: "{{ doc('copper_and_gold') }}"
      - name: is_regulated
        description: "Whether the potion is subject to Guild regulation."
      - name: potency
        description: "Potency rating from 1 to 10."