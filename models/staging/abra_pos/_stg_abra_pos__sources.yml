version: 2

sources:
  - name: abra_pos
    description: "Point-of-sale extract, landed via seed load into raw."
    database: RAW
    schema: MERLINCO_APOTHECARIES
    tables:
      - name: raw_orders
        description: "Raw order header records from abra_pos."
      - name: raw_order_items
        description: "Raw order line items from abra_pos. Natural key is order_item_id."
      - name: raw_payments
        description: "Raw payment records from abra_pos."
      - name: raw_potions
        description: "Raw potion dimension from abra_pos."
