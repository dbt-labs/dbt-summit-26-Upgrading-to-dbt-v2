version: 2

models:
  - name: stg_alembic_ops__shops
    description: "One row per shop. The region spelling here is canonical for the project."
    columns:
      - name: shop_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: region
        description: "{{ doc('canonical_region') }}"
        tests:
          - not_null

  - name: stg_alembic_ops__suppliers
    description: "One row per ingredient supplier."
    columns:
      - name: supplier_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: reliability_rating
        description: "Supplier reliability, 1 (worst) to 5 (best)."

  - name: stg_alembic_ops__ingredients
    description: "One row per ingredient."
    columns:
      - name: ingredient_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: supplier_id
        description: "Foreign key to stg_alembic_ops__suppliers."
        tests:
          - not_null
      - name: is_hazardous
        description: "Whether the ingredient requires hazardous handling."

  - name: stg_alembic_ops__potion_ingredients
    description: "Recipe bridge. Natural key is (potion_sku, ingredient_id)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - potion_sku
              - ingredient_id
    columns:
      - name: potion_sku
        description: "Half of the composite key. Foreign key to stg_abra_pos__potions."
        tests:
          - not_null
      - name: ingredient_id
        description: "Half of the composite key. Foreign key to stg_alembic_ops__ingredients."
        tests:
          - not_null

  - name: stg_alembic_ops__brew_events
    description: "One row per production batch."
    columns:
      - name: brew_id
        description: "Primary key."
        tests:
          - unique
          - not_null
      - name: potion_sku
        description: "Foreign key to stg_abra_pos__potions."
        tests:
          - not_null
      - name: quality_check
        description: "Batch QC outcome, lowercased."
        tests:
          - accepted_values:
              arguments:
                values: ['pass', 'fail']
      - name: brew_duration_minutes
        description: "Minutes the batch took. Roughly 1% are null at source."