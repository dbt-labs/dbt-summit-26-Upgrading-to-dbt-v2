version: 2

macros:
  - name: copper_to_gold
    description: "Converts a copper-piece amount into gold crowns at the project's configured rate."
    arguments:
      - name: column_name
        type: varchar
        description: "The column or SQL expression holding a copper amount."

  - name: normalize_region
    description: "Conforms an inconsistently coded region value to the canonical raw_shops.region spelling."
    arguments:
      - name: column_name
        type: varchar
        description: "The column holding a region code or name."

  - name: parse_source_timestamp
    description: "Parses either of the two timestamp formats the source systems emit."
    arguments:
      - name: column_name
        type: varchar
        description: "The column holding a raw timestamp string."

  - name: to_boolean
    description: "Normalizes a messy Y/N/yes/no/TRUE/FALSE string into a real boolean."
    arguments:
      - name: column_name
        type: varchar
        description: "The column holding a messy boolean string."

  - name: get_potion_categories
    description: "Returns the distinct potion categories present in the catalogue, read at compile time."

  - name: audit_columns
    description: "Emits the standard dbt_loaded_at / dbt_invocation_id audit trail."
